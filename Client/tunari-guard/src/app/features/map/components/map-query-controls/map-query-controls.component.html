<div class="query-controls" role="group" aria-label="Fuente, área y período">
  <div>
    <label for="map-source">Fuente de detecciones</label>
    <app-map-info topic="la fuente de detecciones" text="Monitoreo FIRMS consulta los registros reales ingresados al sistema. El archivo histórico reúne una colección analítica del Parque Nacional Tunari y Cochabamba." />
    <select id="map-source" #source [value]="archive() ? 'archive' : 'live'" (change)="sourceChange.emit(source.value === 'archive')">
      <option value="live">Monitoreo FIRMS</option>
      <option value="archive">Archivo histórico</option>
    </select>
  </div>
  <div>
    <label for="map-area">Área de referencia</label>
    <app-map-info topic="el área de referencia" text="Define el ámbito territorial de la consulta y las capas históricas disponibles. Sin área de referencia, la consulta abarca la zona que muestra el mapa." />
    <select id="map-area" #area (change)="contextChange.emit({ areaId: area.value, period: period() })">
      <option value="" [selected]="!areaId()">Sin área de referencia</option>
      @if (areaId() && !areas().length) { <option [value]="areaId()" selected>{{ areaId() }}</option> }
      @for (item of areas(); track item.area_id) {
        <option [value]="item.area_id" [selected]="item.area_id === areaId()">{{ item.nombre_visible }}</option>
      }
    </select>
  </div>
  <div>
    <h3>Fechas de detección <app-map-info topic="las fechas" text="Filtra por fecha de detección en ambas fuentes. Se incluyen ambos días en hora de Bolivia. Pulsa Aplicar fechas para actualizar el mapa." /></h3>
    <label>Desde <input #from type="date" [value]="period().from" /></label>
    <label>Hasta <input #to type="date" [value]="period().to" /></label>
    <button type="button" class="apply-period" (click)="applyPeriod(from.value, to.value)">Aplicar fechas</button>
  </div>
  @if (areaId()) {
    <button type="button" (click)="centerArea.emit()">Centrar en el área</button>
  }
</div>
@if (periodError()) { <p class="period-error" role="alert">{{ periodError() }}</p> }
