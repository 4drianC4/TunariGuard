<section class="space-y-3 text-sm text-[#30351f]" aria-label="Filtros de detecciones">
  <header class="border-b border-[#526b24]/30 pb-3">
    <h2 class="text-sm font-semibold text-[#30351f]">Filtros de detección</h2>
  </header>

  <section class="space-y-2" aria-label="Filtro por sensor y satélite">
    <h3 class="text-xs font-medium text-[#424037]">Sensor y satélite
      <app-map-info topic="el filtro de sensor y satélite" text="Marca las combinaciones que quieras consultar. Si no marcas ninguna, se incluyen todos los sensores y satélites." />
    </h3>
    <div class="space-y-1 rounded-md border border-[#ded6ca] bg-[#fffcf7] p-2">
      @for (platform of platformOptions; track platform.value) {
        <label class="flex cursor-pointer items-center gap-2 rounded px-2 py-1.5 text-xs text-[#424037] hover:bg-[#526b24]/10">
          <input type="checkbox" class="size-4 shrink-0 accent-[#526b4c]" [checked]="filters.platforms.includes(platform.value)"
            (change)="togglePlatform(platform.value, $event)">
          <span class="size-2 shrink-0 rounded-full" [style.background-color]="platform.color" aria-hidden="true"></span>
          <span>{{ platform.label }}</span>
        </label>
      }
    </div>
  </section>

  <div class="space-y-1.5 text-xs text-[#424037]">
    <label for="map-confidence">Confianza mínima</label>
    <app-map-info topic="la confianza" text="Clase asignada por el sensor según las características de la detección. No indica la probabilidad de un incendio." />
    <select id="map-confidence" class="w-full rounded-md border border-[#ded6ca] bg-[#fffcf7] px-3 py-2 text-[#30351f] disabled:opacity-50"
      [value]="filters.minConfidence"
      (change)="setConfidenceThreshold($event)">
      <option value="">Cualquiera</option>
      <option value="LOW">Baja o superior</option>
      <option value="NOMINAL">Nominal o superior</option>
      <option value="HIGH">Solo alta</option>
    </select>
  </div>

  <div class="space-y-1.5 text-xs text-[#424037]">
    <label for="map-frp">Potencia radiativa mínima (FRP)</label>
    <app-map-info topic="la potencia radiativa" text="Estimación en megavatios (MW) de la energía emitida en forma de radiación por el foco térmico." />
    <input id="map-frp" type="number" min="0" step="0.1" placeholder="Sin mínimo"
      class="w-full rounded-md border border-[#ded6ca] bg-[#fffcf7] px-3 py-2 text-[#30351f] placeholder:text-[#b84e20] disabled:opacity-50"
      [value]="filters.minFrpMw ?? ''" (input)="setFrpThreshold($event)" [disabled]="!hasFrpValues && filters.minFrpMw === null">
    @if (!hasFrpValues && filters.minFrpMw === null) { <span class="block text-xs text-[#526b24]">Sin valores FRP disponibles.</span> }
  </div>

  <div class="space-y-1.5 text-xs text-[#424037]">
    <label for="map-day-night">Momento de detección</label>
    <app-map-info topic="el momento de detección" text="Día o noche según las condiciones de iluminación al paso del satélite." />
    <select id="map-day-night" class="w-full rounded-md border border-[#ded6ca] bg-[#fffcf7] px-3 py-2 text-[#30351f] disabled:opacity-50"
      [value]="filters.dayNight"
      (change)="setDayNight($event)"
      [disabled]="!hasDayNightValues && !filters.dayNight">
      <option value="">Día y noche</option>
      <option value="DAY">Día</option>
      <option value="NIGHT">Noche</option>
    </select>
    @if (!hasDayNightValues && !filters.dayNight) { <span class="block text-xs text-[#526b24]">Sin este dato disponible.</span> }
  </div>

  <footer class="border-t border-[#526b24]/30 pt-3">
    <button type="button" class="text-xs font-semibold text-[#b84e20] hover:text-[#30351f]" (click)="reset.emit()">Restablecer filtros</button>
  </footer>
</section>
