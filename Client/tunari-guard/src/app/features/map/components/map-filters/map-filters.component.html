<section class="space-y-5 p-4 text-sm text-[#30351f]" aria-label="Filtros de detecciones">
  <header class="border-b border-[#526b24]/30 pb-3">
    <p class="text-xs font-semibold uppercase tracking-widest text-[#526b24]">Exploración</p>
    <h2 class="mt-1 text-base font-semibold text-[#30351f]">Filtros de detección</h2>
  </header>

  <label class="block space-y-1.5 text-xs text-[#424037]">
    <span class="group relative inline-flex items-center gap-1">
      Confianza mínima
      <span tabindex="0" aria-label="Información sobre confianza" class="cursor-help text-[#526b24]">ⓘ
        <span role="tooltip" class="pointer-events-none invisible absolute left-0 top-full z-50 mt-2 w-60 rounded-lg border border-[#526b24]/30 bg-[#30351f] p-3 text-xs font-normal leading-5 text-[#fffcf7] shadow-xl group-hover:visible group-focus:visible">
          Clase asignada por el producto satelital; no es la probabilidad de que exista un incendio.
        </span>
      </span>
    </span>
    <select class="w-full rounded-md border border-[#526b24]/45 bg-[#526b24]/5 px-3 py-2 text-[#30351f] disabled:opacity-50"
      [value]="filters.minConfidence"
      (change)="setConfidenceThreshold($event)"
      [disabled]="!confidenceOptions.length">
      <option value="">Cualquiera</option>
      <option value="LOW">Baja o superior</option>
      <option value="NOMINAL">Nominal o superior</option>
      <option value="HIGH">Solo alta</option>
    </select>
    @if (!confidenceOptions.length) { <span class="block text-xs text-[#526b24]">Sin clases de confianza disponibles.</span> }
  </label>

  <label class="block space-y-1.5 text-xs text-[#424037]">
    <span class="group relative inline-flex items-center gap-1">
      FRP mínimo (MW)
      <span tabindex="0" aria-label="Información sobre FRP" class="cursor-help text-[#526b24]">ⓘ
        <span role="tooltip" class="pointer-events-none invisible absolute left-0 top-full z-50 mt-2 w-60 rounded-lg border border-[#526b24]/30 bg-[#30351f] p-3 text-xs font-normal leading-5 text-[#fffcf7] shadow-xl group-hover:visible group-focus:visible">
          Estimación de la potencia radiativa del píxel. No mide el área quemada.
        </span>
      </span>
    </span>
    <input type="number" min="0" step="0.1" placeholder="Sin mínimo"
      class="w-full rounded-md border border-[#526b24]/45 bg-[#526b24]/5 px-3 py-2 text-[#30351f] placeholder:text-[#b84e20] disabled:opacity-50"
      [value]="filters.minFrpMw ?? ''" (input)="setFrpThreshold($event)" [disabled]="!hasFrpValues">
    @if (!hasFrpValues) { <span class="block text-xs text-[#526b24]">Sin valores FRP disponibles.</span> }
  </label>

  <label class="block space-y-1.5 text-xs text-[#424037]">
    <span class="group relative inline-flex items-center gap-1">
      Momento de detección
      <span tabindex="0" aria-label="Información sobre día y noche" class="cursor-help text-[#526b24]">ⓘ
        <span role="tooltip" class="pointer-events-none invisible absolute left-0 top-full z-50 mt-2 w-60 rounded-lg border border-[#526b24]/30 bg-[#30351f] p-3 text-xs font-normal leading-5 text-[#fffcf7] shadow-xl group-hover:visible group-focus:visible">
          Indica si el satélite registró la detección durante el día o la noche.
        </span>
      </span>
    </span>
    <select class="w-full rounded-md border border-[#526b24]/45 bg-[#526b24]/5 px-3 py-2 text-[#30351f] disabled:opacity-50"
      [value]="filters.dayNight"
      (change)="setDayNight($event)"
      [disabled]="!hasDayNightValues">
      <option value="">Día y noche</option>
      <option value="D">Día</option>
      <option value="N">Noche</option>
    </select>
    @if (!hasDayNightValues) { <span class="block text-xs text-[#526b24]">Sin este dato disponible.</span> }
  </label>

  <section class="space-y-2" aria-label="Filtro por satélite">
    <h3 class="text-xs font-medium text-[#424037]">Plataformas @if (filters.platforms.length) { <span class="text-[#526b24]">({{ filters.platforms.length }})</span> }</h3>
    @if (platformOptions.length) {
      <div class="max-h-40 space-y-1 overflow-y-auto rounded-md border border-[#526b24]/45 bg-[#526b24]/5 p-2">
        @for (platform of platformOptions; track platform) {
          <label class="flex cursor-pointer items-center gap-2 rounded px-2 py-1.5 text-xs text-[#424037] hover:bg-[#526b24]/10">
            <input type="checkbox" class="size-4 accent-[#b84e20]" [checked]="filters.platforms.includes(platform)"
              (change)="togglePlatform(platform, $event)">
            <span>{{ platform }}</span>
          </label>
        }
      </div>
    } @else {
      <p class="text-xs text-[#526b24]">No hay satélites disponibles en los datos recibidos.</p>
    }
  </section>

  <footer class="border-t border-[#526b24]/30 pt-3">
    <button type="button" class="text-xs font-semibold text-[#b84e20] hover:text-[#30351f]" (click)="reset.emit()">Restablecer filtros</button>
  </footer>
</section>
