<section class="flex min-w-0 flex-wrap items-center gap-x-4 gap-y-2 border-l border-[#526b24]/30 pl-4 max-[720px]:pl-2" aria-label="Período recibido del calendario">
  <span class="text-[9px] font-extrabold tracking-widest text-[#b84e20]">PERÍODO RECIBIDO</span>
  <strong class="text-xs font-semibold text-[#30351f]">
    {{ period.from | date:'mediumDate':'-0400':'es-BO' }} — {{ period.to | date:'mediumDate':'-0400':'es-BO' }}
  </strong>
  <span class="text-[10px] text-[#595a4c]">{{ areaId }}</span>
</section>
