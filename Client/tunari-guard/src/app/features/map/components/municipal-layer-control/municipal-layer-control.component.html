<section class="border-t border-[#526b24]/30 bg-white text-[#30351f]"
  aria-label="Capas de referencia GAMC">
  <button
    type="button"
    class="flex w-full items-center gap-3 px-4 py-3 text-left hover:bg-[#526b24]/10"
    (click)="togglePanel()"
    [attr.aria-expanded]="open">
    <span class="grid size-8 place-items-center rounded-lg border border-[#526b24]/45 bg-[#526b24]/15 font-bold text-[#526b24]"
      aria-hidden="true">G</span>
    <span class="min-w-0 flex-1">
      <strong class="block text-sm font-semibold">Capas de referencia GAMC</strong>
      <small class="text-xs text-[#526b24]">Activa una capa para verla y consultar su leyenda</small>
    </span>
    <span class="text-[#526b24]" aria-hidden="true">{{ open ? '⌃' : '⌄' }}</span>
  </button>

  @if (open) {
    <div class="space-y-2 px-3 pb-3">
      @for (layer of layers; track layer.id) {
        <article class="rounded-lg border border-[#526b24]/30 bg-[#526b24]/5 p-3">
          <label class="flex cursor-pointer items-start gap-2">
            <input
              type="checkbox"
              class="mt-0.5 size-4 accent-[#b84e20]"
              [checked]="layer.visible"
              (change)="setLayerVisibility(layer.id, $event)">

            <span class="min-w-0 flex-1">
              <strong class="block text-xs font-semibold text-[#30351f]">{{ layer.name }}</strong>
              <small class="mt-1 block text-xs leading-4 text-[#526b24]">{{ layer.purpose }}</small>
            </span>

          </label>

          @if (layer.visible) {
            <div class="mt-3 border-t border-[#526b24]/30 pt-2">
              @if (!layer.legendFailed) {
                <img
                  class="max-h-16 max-w-full object-contain object-left"
                  [src]="layer.legendUrl"
                  [alt]="'Leyenda oficial de ' + layer.name"
                  (error)="legendError.emit(layer.id)">
              } @else {
                <p class="text-xs text-[#b84e20]">
                  Leyenda no disponible.
                  <button type="button" class="ml-1 text-[#b84e20] underline"
                    (click)="retry.emit(layer.id)">Reintentar</button>
                </p>
              }
            </div>
          }

          @if (layer.status === 'error') {
            <button
              type="button"
              class="mt-2 rounded-md border border-[#526b24]/45 px-2 py-1 text-xs text-[#414033] hover:bg-[#526b24]/10"
              (click)="retry.emit(layer.id)">Reintentar conexión</button>
          }
        </article>
      }

      <p class="border-t border-[#526b24]/30 pt-2 text-xs leading-4 text-[#526b24]">
        Capas oficiales de referencia. La leyenda aparece al activar cada capa.
      </p>
    </div>
  }
</section>
