<section class="min-w-0 space-y-4" aria-label="Mapa de focos">
  <app-page-header
    section="observación territorial"
    title="Observación territorial"
    description="Consulta el archivo histórico de detecciones satelitales MODIS y VIIRS en el Parque Nacional Tunari y su entorno."
  />

  <app-hotspot-map
    [areaId]="mapState.areaId()"
    [period]="mapState.period()"
    (contextChange)="onContextChange($event)"
    (selectionChange)="onSelectionChange($event)"
    (areaOfInterestChange)="onAreaOfInterestChange($event)" />

</section>
