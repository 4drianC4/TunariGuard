<section class="min-w-0 space-y-4" aria-labelledby="map-page-title">
 

   <app-page-header
    section="observación territorial"
    title="Observación territorial"
    description="Explora detecciones satelitales MODIS y VIIRS en el Parque Nacional Tunari y su entorno."
  />

  <app-hotspot-map
    (selectionChange)="onSelectionChange($event)"
    (areaOfInterestChange)="onAreaOfInterestChange($event)" />

  <p class="m-0 rounded-xl border border-[#dfd8cd] bg-[#fffcf8] px-4 py-3 text-xs leading-5 text-[#595a4c]">
    Una detección satelital es una señal térmica y no confirma un incendio. El período lo proporciona el módulo de calendario; esta página no añade controles temporales propios.
  </p>
</section>
