
<aside class="tg-sidebar">
  <!-- Encabezado móvil independiente del diseño original de escritorio. -->
  <div class="tg-mobile-bar">
    <a class="tg-mobile-brand" routerLink="/inicio" (click)="closeMobile()" aria-label="TunariGuard - Inicio">
      <img src="/assets/logos/SVG/LOGO_1.svg" alt="" aria-hidden="true" />
      <span><b>TUNARI</b>GUARD</span>
    </a>
    <button class="tg-mobile-toggle" type="button" (click)="toggleMobile()"
      [attr.aria-expanded]="mobileOpen()" aria-controls="tg-navigation-panel"
      [attr.aria-label]="mobileOpen() ? 'Cerrar menú' : 'Abrir menú'">
      @if (mobileOpen()) {
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg>
      } @else {
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      }
    </button>
  </div>
  <button class="tg-mobile-overlay" type="button" tabindex="-1" (click)="closeMobile()" aria-label="Cerrar menú"></button>
  <div class="tg-navigation-panel" id="tg-navigation-panel">
    <button class="tg-collapse-btn" type="button" (click)="toggleDesktop()"
      [attr.aria-expanded]="!collapsed()"
      [attr.aria-label]="collapsed() ? 'Expandir menú lateral' : 'Comprimir menú lateral'"
      [attr.title]="collapsed() ? 'Expandir menú' : 'Comprimir menú'">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
    </button>
    <button class="tg-panel-close" type="button" (click)="closeMobile()" aria-label="Cerrar menú">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg>
    </button>

  <!-- LOGO TUNARIGUARD -->

<a
  class="tg-brand" (click)="closeMobile()"
  routerLink="/inicio"
  aria-label="TunariGuard - Ir al inicio"
>
  <span class="tg-brand__container">
    <img
      class="tg-brand__logo"
      src="/assets/logos/SVG/LOGOHORIZONTALWHITE.svg"
      alt="TunariGuard - Monitoreo satelital forestal"
    />
      <img class="tg-brand__compact-logo" src="/assets/logos/SVG/LOGO_1.svg" alt="" aria-hidden="true" />
  </span>
</a>


  <!-- TÍTULO DEL MENÚ -->
  <div class="tg-menu-heading">
    <span>MONITOREO SATELITAL</span>
    <span class="tg-heading-line"></span>
  </div>

  <!-- NAVEGACIÓN PRINCIPAL -->
  <nav
    class="tg-main-nav"
    aria-label="Menú principal"
  >
    @for (item of nav; track item.path) {

      <a
        (click)="closeMobile()" [routerLink]="item.path"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        [attr.title]="item.label" [attr.aria-label]="item.label"
      >

        <span class="tg-nav-icon">
          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <use
              [attr.href]="'/assets/tunari-ui/iconos.svg#' + item.icon"
            ></use>
          </svg>
        </span>

        <span class="tg-nav-label">
          {{ item.label }}
        </span>

      </a>

    }
  </nav>

  <!-- DECORACIÓN INFERIOR -->
  <div
    class="tg-mountain-art"
    aria-hidden="true"
  ></div>

  <!-- PIE DEL SIDEBAR -->
  <div class="tg-sidebar-foot">
    MVP académico · Datos DEMO
  </div>

  </div>
</aside>
